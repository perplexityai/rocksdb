---
name: Retained native coverage
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-arm64:
    name: Native Linux ARM64 smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
      with:
        bazelisk-cache: true
        cache-save: "${{ github.event_name == 'push' }}"
        disk-cache: rocksdb-retained-linux-arm64
        repository-cache: true
    - name: Build and smoke Linux ARM64
      shell: bash
      run: |
        set -euo pipefail
        bazel build -c opt //:rocksdb-smoke-aarch64-unknown-linux-gnu
        mapfile -t outputs < <(bazel cquery -c opt --output=files //:rocksdb-smoke-aarch64-unknown-linux-gnu)
        [[ ${#outputs[@]} -eq 1 ]]
        "$PWD/${outputs[0]}" "$RUNNER_TEMP/rocksdb-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  bcr-overlay-macos:
    name: BCR slow suites on macOS ARM64 (Bazel ${{ matrix.bazel }})
    runs-on: macos-15
    # Allow compilation plus each suite's existing one-hour test timeout.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        bazel: [8.4.1, 9.2.0, 10.0.0rc2]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify native macOS ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          uname -sm
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name == 'push' }}
          disk-cache: ${{ github.workflow }}-bcr-macos-arm64-${{ matrix.bazel }}
          repository-cache: true
      - name: Test complete table, WAL, and compression suites
        working-directory: tests/bcr
        shell: bash
        run: |
          set -euo pipefail
          bcr_compat_flags=(--incompatible_autoload_externally=)
          if [[ "$USE_BAZEL_VERSION" == 8.* ]]; then
            bcr_compat_flags+=(
              --incompatible_config_setting_private_default_visibility
              --incompatible_disable_starlark_host_transitions
              --incompatible_disable_native_repo_rules
              --incompatible_strict_action_env
            )
          fi
          registry=$(mktemp -d)
          trap 'rm -rf "$registry"' EXIT
          version=$(python3 -c 'import json; print(json.load(open("../../bcr/metadata.json"))["versions"][-1])')
          python3 ../../tools/stage_bcr_entry.py \
            --source-registry ../../bcr --target-registry "$registry" \
            --module rocksdb --version "$version"
          bazel test \
            --registry="file://$registry" \
            --registry=https://bcr.bazel.build \
            --compilation_mode=fastbuild \
            --copt=-O1 \
            --nocache_test_results \
            --flaky_test_attempts=1 \
            --test_output=errors \
            "${bcr_compat_flags[@]}" \
            @rocksdb//:table_table_test @rocksdb//:db_db_wal_test \
            @rocksdb//:util_compression_test
      - name: Collect upstream test logs
        if: always()
        working-directory: tests/bcr
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d bazel-testlogs ]]; then
            cp -RL bazel-testlogs "$RUNNER_TEMP/rocksdb-testlogs"
          fi
      - name: Upload upstream test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bcr-macos-arm64-testlogs-bazel-${{ matrix.bazel }}
          path: ${{ runner.temp }}/rocksdb-testlogs
          if-no-files-found: warn
