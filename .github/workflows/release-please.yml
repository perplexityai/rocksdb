name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Wait for exact main Buildkite checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/buildkite-release-gate.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 tests/validate_bcr.py
      - name: Update release PRs and publish merged release PRs
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: node tools/bcr_release.cjs
