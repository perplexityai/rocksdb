---
name: Publish distributions
'on':
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ github.event.release.tag_name || inputs.tag }}"
    - env:
        GH_TOKEN: "${{ github.token }}"
        RELEASE_TAG: "${{ github.event.release.tag_name || inputs.tag }}"
      run: python3 .github/scripts/gha-release-gate.py
      id: gate
    outputs:
      commit: "${{ steps.gate.outputs.commit }}"
  build:
    needs: gate
    uses: "./.github/workflows/ci.yml"
    with:
      ref: "${{ needs.gate.outputs.commit }}"
  arm64:
    name: Release smoke / Linux ARM64
    needs:
    - build
    - gate
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: "${{ needs.gate.outputs.commit }}"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: distributions
        path: release
    - env:
        CI_RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}"
      run: |-
        python3 .github/ci/artifacts.py verify release
        tar -xzf release/rocksdb-aarch64-unknown-linux-gnu.tar.gz -C release
        release/rocksdb-aarch64-unknown-linux-gnu/rocksdb_smoke_test "$RUNNER_TEMP/rocksdb-release"
        rm -rf release/rocksdb-aarch64-unknown-linux-gnu
  publish:
    needs:
    - build
    - arm64
    - gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: "${{ needs.gate.outputs.commit }}"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: distributions
        path: release
    - name: Publish verified assets
      env:
        CI_RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}"
        GH_TOKEN: "${{ github.token }}"
        RELEASE_TAG: "${{ github.event.release.tag_name || inputs.tag }}"
      run: |-
        python3 .github/ci/artifacts.py verify release
        python3 - <<'UPLOAD'
        import json, os, subprocess
        assets = json.load(open('.github/ci/assets.json'))
        subprocess.run(['gh', 'release', 'upload', os.environ['RELEASE_TAG'],
                        *['release/' + name for name in assets], '--clobber'], check=True)
        UPLOAD
