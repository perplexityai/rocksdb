name: Release overlay

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Checked-in BCR version (for example, 11.8.1 or 11.8.1.bcr.1)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate overlay
        run: python3 tests/validate_bcr.py

      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:\.bcr\.[1-9]\d*)?", version):
              raise SystemExit("Expected an upstream version with an optional .bcr.N revision")
          metadata = json.loads(Path("bcr/modules/rocksdb/metadata.json").read_text())
          if version not in metadata["versions"]:
              raise SystemExit(f"No checked-in rocksdb@{version} registry entry")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::GH_RELEASE_TOKEN is required to trigger artifact and BCR workflows"
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/v${VERSION}" \
            -f "sha=${GITHUB_SHA}"
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "rocksdb ${VERSION}" \
            --generate-notes
